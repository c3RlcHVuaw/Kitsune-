name: Windows

on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml', 'PacketTunnel/RuleSets/**']
  workflow_dispatch:

env:
  SING_BOX: 1.14.4
  WINTUN: 0.14.1

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Core tests
        run: dotnet test windows/Kitsune.Core.Tests -c Release

      - name: Publish app
        shell: pwsh
        run: |
          dotnet publish windows/Kitsune.App/Kitsune.App.csproj -c Release -r win-x64 -p:Platform=x64 -o out/Kitsune
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem windows/Kitsune.App/obj -Recurse -Filter output.json | ForEach-Object { Write-Host $_.FullName; Get-Content $_.FullName }
            exit 1
          }

      - name: Bundle sing-box, Wintun and rule sets
        shell: pwsh
        run: |
          $core = "out/Kitsune/core"
          New-Item -ItemType Directory -Force $core | Out-Null
          Invoke-WebRequest "https://github.com/SagerNet/sing-box/releases/download/v$env:SING_BOX/sing-box-$env:SING_BOX-windows-amd64.zip" -OutFile sb.zip
          Expand-Archive sb.zip sb
          Copy-Item (Get-ChildItem sb -Recurse -Filter sing-box.exe | Select-Object -First 1).FullName $core
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-$env:WINTUN.zip" -OutFile wintun.zip
          Expand-Archive wintun.zip wintun
          Copy-Item wintun/wintun/bin/amd64/wintun.dll $core
          Copy-Item PacketTunnel/RuleSets "$core/RuleSets" -Recurse -Exclude SNAPSHOT_DATE
          & "$core/sing-box.exe" version
          Compress-Archive -Path out/Kitsune/* -DestinationPath Kitsune-win-x64.zip

      - name: Screenshots of the real app
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          $state = "$env:APPDATA\Kitsune"
          function Shot($name, $arguments) {
            $p = if ($arguments) { Start-Process out\Kitsune\Kitsune.exe -ArgumentList $arguments -PassThru } else { Start-Process out\Kitsune\Kitsune.exe -PassThru }
            Start-Sleep 14
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png")
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Get-Process sing-box -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep 2
          }
          Remove-Item -Recurse -Force $state -ErrorAction SilentlyContinue
          Shot "0-onboarding" ""
          New-Item -ItemType Directory -Force $state | Out-Null
          Copy-Item windows\demo-state.json "$state\state.json"
          foreach ($page in "home","servers","routes","history","settings") { Shot $page "--page=$page" }

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $v = ((Select-Xml -Path windows/Kitsune.App/Kitsune.App.csproj -XPath '//Version').Node.InnerText)
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows\installer.iss /DSourceDir="$PWD\out\Kitsune" /DAppVersion=$v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item out\Kitsune-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Kitsune-win-x64
          path: |
            Kitsune-win-x64.zip
            out/Kitsune-Setup.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/*.png
          if-no-files-found: ignore
